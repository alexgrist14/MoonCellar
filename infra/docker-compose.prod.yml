name: mooncellar-infra

services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    command: ["mongod", "--auth"]
    restart: always
    ports:
      # Loopback only: reachable via SSH tunnel, never from the public internet.
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?missing in infra/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?missing in infra/.env}
    volumes:
      - type: bind
        source: ${MONGO_DATA_DIR:?missing in infra/.env}
        target: /data/db
        bind:
          create_host_path: false
    networks:
      - mooncellar

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: always
    volumes:
      - loki_data:/loki
    networks:
      - mooncellar

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    restart: always
    volumes:
      - ./monitoring/faro.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki
    networks:
      - mooncellar

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?missing in infra/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?missing in infra/.env}
    volumes:
      - type: bind
        source: ${GRAFANA_DATA_DIR:?missing in infra/.env}
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - mooncellar

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    restart: always
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - type: bind
        source: ${PROMETHEUS_DATA_DIR:?missing in infra/.env}
        target: /prometheus
        bind:
          create_host_path: false
    mem_limit: 256m
    networks:
      - mooncellar

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: always
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?missing in infra/.env}
    volumes:
      - ./searxng:/etc/searxng:rw
    mem_limit: 256m
    networks:
      - mooncellar

  gitlab:
    image: gitlab/gitlab-ce:19.4.2-ce.0
    container_name: gitlab
    hostname: gitlab.mooncellar.space
    restart: always
    shm_size: 256m
    ports:
      # Web behind the host nginx (TLS there); Git over SSH on 2222, the host sshd keeps 22.
      - "127.0.0.1:8929:80"
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.mooncellar.space'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['real_ip_trusted_addresses'] = ['127.0.0.1', '172.16.0.0/12']
        nginx['real_ip_header'] = 'X-Forwarded-For'
        nginx['real_ip_recursive'] = 'on'
        letsencrypt['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['usage_ping_enabled'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
        registry['enable'] = false
        gitlab_pages['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_rails['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }
        gitaly['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000', 'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2' }
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    # Caps GitLab so a memory spike cannot push MongoDB and the apps out.
    mem_limit: 4g

  coturn:
    image: coturn/coturn:4.18.0
    container_name: coturn
    restart: always
    # Relay ports are a UDP range: host networking, so the host firewall (ufw) filters them.
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-game.mooncellar.space}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$TURN_SECRET" ]; then
          echo "TURN_SECRET is not set in infra/.env: the relay stays off"
          exec sleep infinity
        fi
        umask 077
        printf 'static-auth-secret=%s\n' "$$TURN_SECRET" > /tmp/turnserver.conf
        exec turnserver -c /tmp/turnserver.conf \
          --log-file=stdout --simple-log --relay-threads=1 \
          --listening-port=3478 --min-port=49160 --max-port=49200 \
          --fingerprint --use-auth-secret --realm="$$TURN_REALM" \
          --no-tls --no-tcp-relay --no-multicast-peers \
          --user-quota=8 --total-quota=400 --max-bps=262144 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
    mem_limit: 128m

volumes:
  loki_data:
  gitlab_config:
  gitlab_logs:
  gitlab_data:

networks:
  mooncellar:
    name: mooncellar
    external: true
