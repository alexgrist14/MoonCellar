name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        env:
          HUSKY: 0
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  deploy:
    needs: [changes, lint]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest

    env:
      DEPLOY_WEB: ${{ needs.changes.outputs.web }}
      DEPLOY_API: ${{ needs.changes.outputs.api }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build images
        run: |
          IMAGES=""

          if [ "$DEPLOY_WEB" = "true" ]; then
            echo "${{ secrets.HOST_ENV_WEB }}" > apps/web/.env;
            podman build \
              -f apps/web/Dockerfile \
              -t mooncellar-frontend:latest \
              .
            IMAGES="$IMAGES mooncellar-frontend:latest"
          fi

          if [ "$DEPLOY_API" = "true" ]; then
            echo "${{ secrets.HOST_ENV_API }}" > apps/api/.env;
            podman build \
              -f apps/api/Dockerfile \
              -t mooncellar-backend:latest \
              .
            IMAGES="$IMAGES mooncellar-backend:latest"
          fi

          podman save --multi-image-archive -o images.tar $IMAGES
          gzip images.tar

      - name: Copy images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images.tar.gz"
          target: "/tmp/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_WEB,DEPLOY_API
          script: |
            set -e

            podman load < /tmp/images.tar.gz

            if [ "$DEPLOY_WEB" = "true" ]; then
              cd ${{ secrets.WORK_DIR_WEB }}
              ./run.sh
              systemctl --user daemon-reload
              systemctl restart --user Mooncellar-Frontend.service
            fi

            if [ "$DEPLOY_API" = "true" ]; then
              cd ${{ secrets.WORK_DIR_API }}
              ./run.sh
              systemctl --user daemon-reload
              systemctl restart --user Mooncellar-Backend.service
            fi

            podman image prune -f
            rm /tmp/images.tar.gz
