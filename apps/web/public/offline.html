<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#191d24" />
    <meta name="robots" content="noindex" />
    <title>Offline | MoonCellar</title>
    <link rel="icon" href="/images/logo-icon.png" type="image/png" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #191d24;
        color: #d9d9d9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 360px;
        padding: 32px 24px;
        border-radius: 20px;
        background: #212731;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        color: #ffffff;
        font-size: 20px;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        padding: 8px 16px;
        border: 0;
        border-radius: 8px;
        background: #6951ee;
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo-icon.png" alt="" />
      <h1>You are offline</h1>
      <p>MoonCellar needs a connection to load your games. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
